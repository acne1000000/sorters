<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Tracker</title>
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --surface-2: #eaeef1;
    --text: #1c262f;
    --text-muted: #647686;
    --border: #dde3e8;
    --accent: #354e62;
    --accent-text: #ffffff;
    --accent-soft: #dde6ec;
    --success: #3d7a5c;
    --success-soft: #e3efe8;
    --danger: #b5473a;
    --chip-bg: #eaeef1;
    --border-faint: rgba(28, 38, 47, 0.055);
    --shadow: 0 1px 2px rgba(30,45,58,0.06), 0 2px 8px rgba(30,45,58,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171b;
      --surface: #1a2229;
      --surface-2: #232c34;
      --text: #eaeef1;
      --text-muted: #93a3ae;
      --border: #2d3943;
      --accent: #7ea1b8;
      --accent-text: #0e1418;
      --accent-soft: #24333d;
      --success: #6fbb92;
      --success-soft: #1c332a;
      --danger: #e0857a;
      --chip-bg: #232c34;
      --border-faint: rgba(234, 238, 241, 0.06);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 12px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171b;
    --surface: #1a2229;
    --surface-2: #232c34;
    --text: #eaeef1;
    --text-muted: #93a3ae;
    --border: #2d3943;
    --accent: #7ea1b8;
    --accent-text: #0e1418;
    --accent-soft: #24333d;
    --success: #6fbb92;
    --success-soft: #1c332a;
    --danger: #e0857a;
    --chip-bg: #232c34;
    --border-faint: rgba(234, 238, 241, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 12px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body {
    overflow-x: hidden;
    width: 100%;
    max-width: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 640px; width: 100%; margin: 0 auto; padding: 16px 16px 48px; overflow-x: hidden; }
  .header-row {
    position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 40;
    height: 56px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 max(16px, calc((100% - 640px) / 2 + 16px));
    background: var(--bg); transition: transform 0.25s ease;
  }
  .header-row.hidden { transform: translateY(-110%); }
  .plain-btn.hidden { transform: translateY(-110%); }
  .header-spacer-block { height: calc(env(safe-area-inset-top, 0px) + 56px); }
  .plain-btn {
    position: fixed; z-index: 1100;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: max(16px, calc((100% - 640px) / 2 + 16px));
    width: 40px; height: 40px; border: none; background: none; color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; margin-left: -8px;
    transition: transform 0.25s ease;
  }
  .plain-btn:active { opacity: 0.6; }
  .logo-img-small { width: 30px; height: 30px; border-radius: 8px; display: block; }
  .account-circle-btn {
    position: absolute;
    right: max(16px, calc((100% - 640px) / 2 + 16px));
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    overflow: hidden;
    font-size: 15px;
    font-weight: 700;
    transition: opacity 0.15s;
  }
  .account-circle-btn:active { opacity: 0.75; }
  .account-circle-btn.logged-in {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .account-circle-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .toggle-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .daycount-toggle {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 10px 6px; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    font-size: 13px; font-weight: 700; cursor: pointer; user-select: none;
  }
  .view-toggle-grey { background: var(--surface-2); color: var(--text); }
  .dot-icon { position: relative; width: 16px; height: 16px; flex-shrink: 0; }
  .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.32); transition: background 0.15s; }
  .dot-a { top: 0; left: 0; }
  .dot-b { bottom: 0; right: 0; }
  .dot.lit { background: #ffffff; }
  .view-toggle-grey .dot.lit { background: var(--text); }
  .view-toggle-grey .dot { background: var(--text-muted); opacity: 0.4; }
  .view-toggle-grey .dot.lit { opacity: 1; }
  .view-icon { position: relative; width: 18px; height: 14px; flex-shrink: 0; }
  .view-icon svg { position: absolute; top: 0; left: 0; }
  .view-icon .back-person { opacity: 0.4; transition: opacity 0.15s; }
  .view-icon.team .back-person { opacity: 1; }
  .daycount-toggle .dcount-label, .daycount-toggle #dayCountLabel { display: inline-block; min-width: 84px; text-align: left; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .work-area { padding: 0 0 18px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .row { display: flex; align-items: center; gap: 10px; }
  label.field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; display: block; margin-bottom: 6px; }
  .field-label.section-title-lg { font-size: 24px; color: var(--text); text-transform: none; letter-spacing: normal; margin-bottom: 10px; font-weight: 700; }
  input[type="date"], input[type="text"], select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 15px; font-family: inherit;
  }
  input[type="date"]:focus, input[type="text"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .auto-note { font-size: 12px; color: var(--text-muted); margin-top: 6px; margin-bottom: 14px; }

  .date-box {
    display: flex; align-items: center; gap: 10px;
  }
  .date-box .dbx-label {
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
  }
  .date-box input[type="date"] {
    border: none; background: transparent; padding: 0; width: auto;
    text-align: center; font-weight: 600;
  }

  .route-grid { margin-top: 26px; }
  .route-chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 3px;
    cursor: pointer; text-align: center; background: var(--surface); user-select: none;
  }
  .route-chip:active { background: var(--surface-2); }
  .route-chip.selected { border-color: var(--sel, #ffc9e1); background: var(--sel, #ffc9e1); color: #1a1a1a; }
  .route-chip .rc-code { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .route-chip.selected .rc-code { color: rgba(0,0,0,0.6); }
  .route-chip .rc-name { font-size: 18px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .empty-note { padding: 16px 12px; color: var(--text-muted); font-size: 13px; text-align: center; }
  .search-wrap { position: relative; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .search-wrap input { flex: 1; min-width: 0; }
  .search-wrap input::placeholder { color: var(--text-muted); opacity: 0.55; }
  .plus-btn { width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 24px; line-height: 1; cursor: pointer; padding: 0; }
  .plus-btn:active { opacity: 0.8; }
  .manual-panel { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 4px; padding: 12px; border: 1.5px dashed var(--border); border-radius: 12px; }
  .manual-panel select { width: 100%; }

  .selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .done-chip {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--sel, #ffc9e1); border-radius: 12px; padding: 10px 18px 8px 10px; min-width: 78px;
  }
  .done-chip .rc-name { color: #1a1a1a; font-size: 18px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .done-chip .rc-code { color: rgba(0,0,0,0.6); font-size: 11px; margin-top: 2px; }
  .done-x {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.16); color: #1a1a1a; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .done-x:active { background: rgba(0,0,0,0.28); }
  .btn { display: block; width: 100%; padding: 12px 0; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:disabled { opacity: 0.5; }
  .btn-primary:active { opacity: 0.85; }
  .status-msg { font-size: 13px; margin-top: 8px; text-align: center; }
  .status-msg.ok { color: var(--success); }
  .status-msg.err { color: var(--danger); }
  .history-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .history-item:last-child { border-bottom: none; }
  .history-date { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .history-daytype { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; margin-left: 6px; }
  .history-daytype.even { background: var(--accent-soft); color: var(--accent); }
  .history-daytype.odd { background: var(--success-soft); color: var(--success); }
  .history-routes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .history-chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--sel, #ffc9e1); border-radius: 9px; padding: 6px 8px; min-width: 56px;
  }
  .history-chip .rc-name { color: #1a1a1a; font-size: 13px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .history-chip .rc-code { color: rgba(0,0,0,0.6); font-size: 9px; margin-top: 1px; }
  .team-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .emp-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface-2); }
  .emp-name { font-weight: 700; font-size: 14px; }
  .emp-time { font-size: 11px; color: var(--text-muted); }

  #teamList .emp-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 26px;
    flex-shrink: 0;
    overflow: hidden;
  }
  #teamList img.emp-avatar {
    object-fit: cover;
    display: block;
  }
  #teamList .history-chip {
    padding: 8px 8px;
    min-width: 68px;
  }
  #teamList .history-chip .rc-name { font-size: 15px; }
  #teamList .history-chip .rc-code { font-size: 10px; }
  
  .count-pill { font-size: 12px; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }

  .acc-section { border-top: 1px solid var(--border-faint, var(--border)); background: transparent; opacity: 1; }
  .acc-section:last-child { border-bottom: 1px solid var(--border-faint, var(--border)); }
  .acc-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 2px; cursor: pointer; user-select: none; }
  .acc-name { font-size: 20px; font-weight: 700; line-height: 1.15; }
  .acc-num { font-size: 13px; font-weight: 300; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.02em; }
  .acc-arrow { font-size: 22px; line-height: 20.4px; height: 20.4px; color: var(--text-muted); font-weight: 600; display: inline-block; transition: transform 0.2s ease; }
  .acc-section.open .acc-arrow { transform: rotate(90deg); }
  .acc-body { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px 0 14px; }
  .acc-section.open .acc-body { display: grid; }
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; z-index: 1000; }
  .drawer-overlay.open { display: block; }
  .drawer { background: var(--surface); width: 78%; max-width: 300px; height: 100%; padding: calc(env(safe-area-inset-top, 0px) + 70px) 18px 18px; box-shadow: var(--shadow); overflow-y: auto; }
  .menu-item { padding: 10px 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .modal-overlay.center { align-items: center; padding: 20px; }
  .confirm-card { border-radius: 18px; }
  .confirm-btns { display: flex; gap: 10px; margin-top: 6px; }
  .confirm-btns .btn { margin-top: 12px; }
  .spinner-note { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0; }

  .signin-prompt {
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .signin-prompt h3 { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
  .signin-prompt p { margin: 0 0 16px; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .signin-prompt a {
    display: inline-block; padding: 11px 28px;
    background: var(--accent); color: var(--accent-text);
    border-radius: 10px; font-size: 14px; font-weight: 700;
    text-decoration: none; cursor: pointer;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 1000;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 18px 28px;
    width: 100%; max-width: 480px; box-shadow: var(--shadow);
    max-height: 85vh; overflow-y: auto;
  }
  @media (min-width: 520px) {
    .modal-overlay { align-items: center; }
    .modal-card { border-radius: 18px; }
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  .modal-close { border: none; background: none; font-size: 22px; color: var(--text-muted); cursor: pointer; line-height: 1; padding: 2px 6px; }
  .lang-row { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .lang-toggle { display: flex; gap: 8px; margin-top: 8px; }
  .lang-btn { flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; }
  .lang-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <button class="plain-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  <div class="header-spacer-block"></div>
  <div class="header-row" id="headerRow">
    <div class="date-box">
      <span class="dbx-label">Date</span>
      <input type="date" id="dateInput">
    </div>
    <button class="account-circle-btn" id="accountCircleBtn" onclick="goToAccount()" aria-label="Account"></button>
  </div>

  <div class="toggle-row">
    <div class="daycount-toggle view-toggle-grey" id="viewToggle" onclick="toggleViewTab()">
      <span class="view-icon" id="viewIcon">
        <svg width="12" height="14" viewBox="0 0 16 18" fill="currentColor" class="back-person" style="left:6px;"><circle cx="8" cy="5" r="3.4"/><path d="M1.5 17c0-3.8 2.9-6.1 6.5-6.1s6.5 2.3 6.5 6.1"/></svg>
        <svg width="12" height="14" viewBox="0 0 16 18" fill="currentColor"><circle cx="8" cy="5" r="3.4"/><path d="M1.5 17c0-3.8 2.9-6.1 6.5-6.1s6.5 2.3 6.5 6.1"/></svg>
      </span>
      <span id="viewLabel" style="display:inline-block; min-width:70px; text-align:left;">My day</span>
    </div>
    <div class="daycount-toggle" id="dayCountToggle" onclick="toggleDayType()">
      <span class="dot-icon"><span class="dot dot-a" id="dotA"></span><span class="dot dot-b" id="dotB"></span></span>
      <span id="dayCountLabel" style="display:inline-block; min-width:104px; text-align:left;">Odd numbers</span>
    </div>
  </div>

  <!-- MY DAY VIEW -->
  <div id="viewMine">
    <div class="signin-prompt" id="signInPrompt" style="display:none;">
      <h3>Sign in to track your routes</h3>
      <p>Your routes are saved to your account and visible to your team.</p>
      <a href="account.html">Sign in / Create account</a>
    </div>

    <div class="work-area">
      <div style="margin-top:14px;">
        <div class="search-wrap">
          <input type="text" id="routeSearch" placeholder="Search route number or name..." oninput="renderRouteGrid()">
          <button class="plus-btn" id="plusBtn" onclick="toggleManual()" aria-label="Add route manually">+</button>
        </div>
        <div class="manual-panel" id="manualPanel" style="display:none;">
          <input type="text" id="manualCode" inputmode="numeric" placeholder="Route number" oninput="onManualCodeInput()">
          <div class="auto-note" id="manualHint" style="margin:0;"></div>
          <input type="text" id="manualName" placeholder="Route name (optional)">
          <select id="manualArea"></select>
          <button class="btn btn-primary" id="manualAddBtn" onclick="addManualRoute()" style="margin-top:8px;">Add as completed</button>
        </div>
        <div class="route-grid" id="routeGrid"></div>
      </div>

      <button class="btn btn-primary" id="submitBtn" onclick="addRouteToDay()">Add route</button>
      <div class="status-msg" id="statusMsg" style="margin-bottom: 28px;"></div>

      <label class="field-label section-title-lg" style="margin-top:16px;">Today's routes</label>
      <div class="selected-tags" id="todayTags"></div>
    </div>
  </div>

  <!-- TEAM VIEW -->
  <div id="viewTeam" style="display:none;">
      <div class="team-header">
        <div style="flex:1;">
          <label class="field-label" data-t="filterByDay">Filter by day</label>
          <input type="date" id="teamDateInput">
        </div>
        <div class="count-pill" id="teamCount">0 submitted</div>
      </div>
      <div id="teamList" class="spinner-note">Loading...</div>
    </div>
  </div>

<div class="drawer-overlay" id="menuOverlay" onclick="closeMenu()">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="menu-item" id="menuHistory" onclick="openHistory()">Recent history</div>
    <div class="menu-item" id="menuStats" onclick="openStats()">Statistics</div>
    <div class="lang-row">
      <span class="field-label" style="margin:0;">Language</span>
      <div class="lang-toggle">
        <div class="lang-btn" id="langEn" onclick="setLanguage('en')">English</div>
        <div class="lang-btn" id="langFi" onclick="setLanguage('fi')">Suomi</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="statsOverlay" onclick="if(event.target.id==='statsOverlay')closeStats()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="statsTitle">Statistics</span><button class="modal-close" onclick="closeStats()">&times;</button></div>
    <label class="field-label" id="statsFromLabel">From</label>
    <input type="date" id="statsFrom" style="display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;min-height:44px;text-align:left;">
    <label class="field-label" id="statsToLabel" style="margin-top:12px;">To</label>
    <input type="date" id="statsTo" style="display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;min-height:44px;text-align:left;">
    <button class="btn btn-primary" id="statsBtn" onclick="downloadStats()">Download Excel</button>
    <div class="status-msg" id="statsMsg"></div>
  </div>
</div>

<div class="modal-overlay" id="historyOverlay" onclick="if(event.target.id==='historyOverlay')closeHistory()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="historyTitle">Recent history</span><button class="modal-close" onclick="closeHistory()">&times;</button></div>
    <div id="historyList" class="spinner-note">Loading...</div>
  </div>
</div>

<div class="modal-overlay center" id="confirmOverlay" onclick="if(event.target.id==='confirmOverlay')closeConfirm()">
  <div class="modal-card confirm-card" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="confirmTitle">Remove route?</span></div>
    <div id="confirmText" style="font-size:14px; color:var(--text-muted);"></div>
    <div class="confirm-btns">

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function weekdayIsEven(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  const wd = new Date(y, m-1, d).getDay();
  return wd === 1 || wd === 3;
}

const expandedAreas = new Set();

function areaColor(area, dt) {
  dt = dt || dayType;
  if (!area) return "#ffc9e1";
  const name = area.split("/")[0];
  const info = AREA_INFO[dt] && AREA_INFO[dt][name];
  return info ? info.color : "#ffc9e1";
}

function renderRouteGrid() {
  const list = getRouteList();
  const q = (document.getElementById("routeSearch").value || "").trim().toLowerCase();
  const box = document.getElementById("routeGrid");
  box.innerHTML = "";
  if (list.length === 0) {
    box.innerHTML = '<div class="empty-note">No odd-day route list has been added yet. Ask to have it added, or switch to Even day.</div>';
    return;
  }
  const filtered = q ? list.filter(r => r[0].includes(q) || r[1].toLowerCase().includes(q)) : list;
  if (filtered.length === 0) {
    box.innerHTML = '<div class="empty-note">No routes match "' + q.replace(/</g,"") + '"</div>';
    return;
  }
  const areaList = currentAreaList();
  areaList.concat([""]).forEach(area => {
    const items = filtered.filter(r => (areaList.includes(r[2]) ? r[2] : "") === area);
    if (!items.length) return;
    const parts = area ? area.split("/") : [T("ungrouped"), ""];
    const sec = document.createElement("div");
    sec.className = "acc-section" + ((q || expandedAreas.has(area)) ? " open" : "");
    const head = document.createElement("div");
    head.className = "acc-head";
    head.innerHTML = '<div><div class="acc-name"></div>' + (parts[1] ? '<div class="acc-num"></div>' : '') + '</div><span class="acc-arrow">\u203a</span>';
    head.querySelector(".acc-name").textContent = parts[0];
    if (parts[1]) head.querySelector(".acc-num").textContent = parts[1];
    head.onclick = () => {
      const open = sec.classList.toggle("open");
      if (open) expandedAreas.add(area); else expandedAreas.delete(area);
    };
    const body = document.createElement("div");
    body.className = "acc-body";
    const color = areaColor(area);
    items.forEach(r => {
      const isPicked = pickedRoutes.some(s => s.code === r[0]);
      const div = document.createElement("div");
      div.className = "route-chip" + (isPicked ? " selected" : "");
      div.style.setProperty("--sel", color);
      div.innerHTML =
        '<span class="rc-name">' + (r[1] || "—") + '</span>' +
        '<span class="rc-code">' + r[0] + '</span>';
      div.onclick = () => { togglePicked([r[0], r[1]]); div.classList.toggle("selected"); };
      body.appendChild(div);
    });
    sec.appendChild(head);
    sec.appendChild(body);
    box.appendChild(sec);
  });
}

function togglePicked(r) {
  const idx = pickedRoutes.findIndex(s => s.code === r[0]);
  if (idx >= 0) pickedRoutes.splice(idx, 1);
  else pickedRoutes.push({code: r[0], label: r[1]});
  updateAddButtonState();
}

function updateAddButtonState() {
  document.getElementById("submitBtn").style.opacity = pickedRoutes.length === 0 ? "0.5" : "1";
}

function setDayType(t, isAuto, keepPicks) {
  dayType = t;
  document.getElementById("dayCountLabel").textContent = t === "odd" ? T("oddNumbers") : T("evenNumbers");
  document.getElementById("dotA").classList.add("lit");
  document.getElementById("dotB").classList.toggle("lit", t === "even");
  if (!keepPicks) { document.getElementById("routeSearch").value = ""; pickedRoutes = []; }
  populateAreaOptions();
  renderRouteGrid();
  updateAddButtonState();
}

async function onDateChange() {
  selectedDate = document.getElementById("dateInput").value || todayStr();
  pickedRoutes = [];
  todayRoutes = [];
  renderTodayTags();
  const auto = weekdayIsEven(selectedDate) ? "even" : "odd";
  await loadTodayRoutes();
  setDayType(todayRoutes.length ? currentDocDayType || auto : auto, !todayRoutes.length);
}

let currentDocDayType = null;

async function loadTodayRoutes() {
  currentDocDayType = null;
  if (!db || !myId) { renderTodayTags(); return; }
  try {
    const { data, error } = await db.from("submissions")
      .select("*").eq("user_id", myId).eq("date", selectedDate).maybeSingle();
    if (error) throw error;
    if (data) {
      todayRoutes = Array.isArray(data.routes) ? data.routes : [];
      currentDocDayType = data.day_type || null;
    }
  } catch (e) {
    console.error("Could not load this day's routes:", e);
  }
  renderTodayTags();
}

function findAreaForCode(code, dt) {
  const item = getRouteList(dt).find(r => r[0] === code);
  return item ? item[2] : "";
}

function renderTodayTags() {
  const wrap = document.getElementById("todayTags");
  wrap.innerHTML = "";
  if (todayRoutes.length === 0) {
    wrap.innerHTML = '<span style="color:var(--text-muted); font-size:13px;">No routes added yet for this day</span>';
    return;
  }
  todayRoutes.forEach(r => {
    const area = findAreaForCode(r.code);
    const color = areaColor(area);
    const tag = document.createElement("div");
    tag.className = "done-chip";
    tag.style.setProperty("--sel", color);
    tag.innerHTML =
      '<button class="done-x" aria-label="Remove">&times;</button>' +
      '<span class="rc-name">' + (r.label || "—") + '</span>' +
      '<span class="rc-code">' + r.code + '</span>';
    tag.querySelector(".done-x").onclick = (e) => { e.stopPropagation(); askRemove(r); };
    wrap.appendChild(tag);
  });
}

}
function closeConfirm() {
  pendingRemoveCode = null;
  document.getElementById("confirmOverlay").classList.remove("open");
}
function confirmRemove() {

  closeConfirm();
  if (code) removeTodayRoute(code);
}

function setMenuBtnIcon(open) {
  document.getElementById("menuBtn").innerHTML = open ? LOGO_ICON : BURGER_SVG;
}
function openMenu() { document.getElementById("menuOverlay").classList.add("open"); setMenuBtnIcon(true); }
function closeMenu() { document.getElementById("menuOverlay").classList.remove("open"); setMenuBtnIcon(false); }
function toggleMenu() {
  const isOpen = document.getElementById("menuOverlay").classList.contains("open");
  if (isOpen) closeMenu(); else openMenu();
}
function openHistory() { closeMenu(); document.getElementById("historyOverlay").classList.add("open"); }
function closeHistory() { document.getElementById("historyOverlay").classList.remove("open"); }

function goToAccount() {
  window.location.href = "account.html";
}

async function removeTodayRoute(code) {
  todayRoutes = todayRoutes.filter(r => r.code !== code);
  renderTodayTags();
  await saveTodayRoutes();
}

let saveInFlight = false, savePending = false;

async function saveTodayRoutes() {
  if (!db || !myId) return;
  if (saveInFlight) { savePending = true; return; }
  saveInFlight = true;
  const statusEl = document.getElementById("statusMsg");
  try {
    do {
      savePending = false;
      const date = selectedDate;
      const routes = todayRoutes.slice();
      const dt = dayType;
      if (routes.length === 0) {
        const { error } = await db.from("submissions").delete()
          .eq("user_id", myId).eq("date", date);
        if (error) throw error;
      } else {
        const { error } = await db.from("submissions").upsert({
          user_id: myId,
          person_name: myName || (currentAccount && currentAccount.email ? currentAccount.email.split("@")[0] : "Employee"),
          date: date,
          day_type: dt,
          routes: routes,
          submitted_at: new Date().toISOString()
        }, { onConflict: "user_id,date" });
        if (error) throw error;
      }
    } while (savePending);
  } catch (e) {
    console.error("Could not save routes:", e);
    statusEl.textContent = T("genericError");
    statusEl.className = "status-msg err";
  }
  saveInFlight = false;
}

function addRouteToDay() {
  const statusEl = document.getElementById("statusMsg");
  statusEl.textContent = "";
  statusEl.className = "status-msg";
  if (pickedRoutes.length === 0) {
    statusEl.textContent = T("pickFirst");
    statusEl.className = "status-msg err";
    return;
  }
  if (!db || !myId) {
    statusEl.textContent = T("noStorage");
    statusEl.className = "status-msg err";
    return;
  }
  let addedCount = 0;
  pickedRoutes.forEach(r => {
    if (!todayRoutes.some(x => x.code === r.code)) { todayRoutes.push({ code: r.code, label: r.label }); addedCount++; }
  });
  pickedRoutes = [];
  document.getElementById("routeSearch").value = "";
  renderTodayTags();
  renderRouteGrid();
  updateAddButtonState();
  statusEl.textContent = addedCount > 0 ? T("addedPick") : T("alreadyAdded");
  statusEl.classList.add(addedCount > 0 ? "ok" : "err");
  if (addedCount > 0) saveTodayRoutes();
}

function fmtDate(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function renderHistory(docs) {
  const el = document.getElementById("historyList");
  if (!docs.length) {
    el.innerHTML = '<div class="empty-note">No submissions yet.</div>';
    return;
  }
  docs.sort((a,b) => b.date.localeCompare(a.date));
  el.innerHTML = "";
  docs.slice(0, 30).forEach(d => {
    const item = document.createElement("div");
    item.className = "history-item";
    const routesHtml = (d.routes || []).map(r => {
      const color = areaColor(findAreaForCode(r.code, d.day_type), d.day_type);
      return '<div class="history-chip" style="--sel:' + color + '">' +
        '<span class="rc-name">' + (r.label || "—") + '</span>' +
        '<span class="rc-code">' + r.code + '</span></div>';
    }).join("");
    item.innerHTML =
      '<div class="history-date">' + fmtDate(d.date) +
      '<span class="history-daytype ' + d.day_type + '">' + d.day_type + '</span></div>' +
      '<div class="history-routes">' + routesHtml + '</div>';
    el.appendChild(item);
  });
}

async function renderTeamList(docs) {
  const el = document.getElementById("teamList");
  const countEl = document.getElementById("teamCount");
  countEl.textContent = docs.length + " submitted";
  if (!docs.length) {
    el.innerHTML = '<div class="empty-note">No one has submitted for this day yet.</div>';
    return;
  }
  const ids = Array.from(new Set(docs.map(d => d.user_id).filter(Boolean)));
  let profiles = {};
  if (ids.length) {
    try {
      const { data, error } = await db.from("profiles")
        .select("id,display_name,avatar_url").in("id", ids);
      if (error) throw error;
      (data || []).forEach(p => { profiles[p.id] = p; });
    } catch (e) { console.error("Could not load employee profiles:", e); }
  }
  const nameOf = d => (profiles[d.user_id] && profiles[d.user_id].display_name) || d.person_name || "Someone";

  docs.sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  el.innerHTML = "";
  docs.forEach(d => {
    const prof = profiles[d.user_id] || {};
    const name = nameOf(d);
    const initial = (name || "?").charAt(0).toUpperCase();
    const time = d.submitted_at ? new Date(d.submitted_at).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}) : "";
    const routesHtml = (d.routes || []).map(r => {
      const color = areaColor(findAreaForCode(r.code, d.day_type), d.day_type);
      return '<div class="history-chip" style="--sel:' + color + '">' +
        '<span class="rc-name">' + (r.label || "—") + '</span>' +
        '<span class="rc-code">' + r.code + '</span></div>';
    }).join("");

    const card = document.createElement("div");
    card.className = "emp-card";
    card.innerHTML =
      '<div class="row" style="justify-content:space-between; align-items:center; gap:10px;">' +
        '<div class="row" style="gap:14px; min-width:0; align-items:center;">' +
          '<span class="emp-avatar" aria-hidden="true"></span>' +
          '<span class="emp-name" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>' +
        '</div>' +
        '<span class="emp-time">' + time + '</span>' +
      '</div>' +
      '<div class="history-routes" style="margin-top:10px;">' + routesHtml + '</div>';

    const avatarEl = card.querySelector(".emp-avatar");
    if (prof.avatar_url) {
      const img = document.createElement("img");
      img.src = prof.avatar_url;
      img.alt = "";
      img.className = "emp-avatar";
      img.onerror = () => { avatarEl.replaceWith(makeInitialAvatar(initial)); };
      avatarEl.replaceWith(img);
    } else {
      avatarEl.replaceWith(makeInitialAvatar(initial));
    }
    card.querySelector(".emp-name").textContent = name;

    el.appendChild(card);
  });
}

function makeInitialAvatar(initial) {
  const span = document.createElement("span");
  span.className = "emp-avatar";
  span.textContent = initial;

}

// Load the best available name from the profile, then user metadata, then email prefix.
async function getBestDisplayName(user) {
  if (!user) return "";
  if (db) {
    try {
      const { data } = await db.from("profiles").select("display_name").eq("id", user.id).maybeSingle();
      if (data && data.display_name) return data.display_name;
    } catch (e) { /* fall through */ }
  }
  if (user.user_metadata && user.user_metadata.display_name) return user.user_metadata.display_name;
  return (user.email || "Employee").split("@")[0];
}

async function startAppForUser(user) {
  myId = user ? user.id : null;
  myName = "";
  currentAccount = user ? { email: user.email || "" } : null;
  if (user) {
    myName = await getBestDisplayName(user);
  }
  updateAccountCircle();

  const prompt = document.getElementById("signInPrompt");
  if (prompt) prompt.style.display = user ? "none" : "block";

  subscribeCustom();

  if (!user) {
    if (unsubMine) db.removeChannel(unsubMine);
    if (unsubTeam) db.removeChannel(unsubTeam);
    unsubMine = unsubTeam = null;
    document.getElementById("historyList").innerHTML = '<div class="empty-note">Sign in to view your history.</div>';
    document.getElementById("teamList").innerHTML = '<div class="empty-note">Sign in to view team submissions.</div>';
    document.getElementById("statusMsg").textContent = "";
    document.getElementById("statusMsg").className = "status-msg";
    return;
  }
  document.getElementById("statusMsg").textContent = "";
  subscribeMine();
  subscribeTeam();
  await loadTodayRoutes();
  if (currentDocDayType && currentDocDayType !== dayType) setDayType(currentDocDayType, false, true);
  updateAddButtonState();
}

}

function getRouteList(dt) {
  dt = dt || dayType;
  const base = dt === "even" ? EVEN_ROUTES : ODD_ROUTES;
  const custom = customRoutes.filter(r => r.dayType === dt);
  const byCode = {};
  custom.forEach(r => { byCode[r.code] = r; });
  const codes = new Set(base.map(r => r[0]));
  const out = base.map(r => [r[0], (byCode[r[0]] && byCode[r[0]].label) || r[1], (byCode[r[0]] && byCode[r[0]].area) || ""]);
  custom.filter(r => !codes.has(r.code))
    .sort((a, b) => a.code.localeCompare(b.code))
    .forEach(r => out.push([r.code, r.label || "", r.area || ""]));
  return out;
}

function mapRowToCustom(row) {
  return {
    code:     row.code,
    label:    row.label || "",
    dayType:  row.day_type,
    area:     row.area || "",
    addedBy:  row.added_by || "",
    addedAt:  row.added_at || 0
  };
}

async function fetchAllCustomRoutes() {
  const PAGE = 1000;
  const out = [];
  let from = 0;
  for (;;) {
    const { data, error } = await db
      .from("custom_routes")
      .select("day_type,code,label,area,added_by,added_at")
      .order("day_type", { ascending: true })
      .order("code", { ascending: true })
      .range(from, from + PAGE - 1);
    if (error) throw error;
    const page = data || [];
    out.push(...page);
    if (page.length < PAGE) break;
    from += PAGE;
  }
  return out;
}

async function refreshCustomRoutes() {
  if (!db) return;
  try {
    const rows = await fetchAllCustomRoutes();
    if (rows.length > 0) {
      customRoutes = rows.map(mapRowToCustom);
    }
  } catch (e) {
    console.error("Could not load custom routes from Supabase; using built-in data:", e);
  }
  renderRouteGrid();
  renderTodayTags();
}

function subscribeCustom() {
  if (!db) return;
  if (unsubCustom) { try { db.removeChannel(unsubCustom); } catch (e) {} unsubCustom = null; }
  if (customReconnectTimer) { clearTimeout(customReconnectTimer); customReconnectTimer = null; }
  refreshCustomRoutes();
  const channel = db
    .channel("shared-custom-routes")
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: "custom_routes" },
      (payload) => {
        try {
          if (payload.eventType === "DELETE") {
            const old = payload.old || {};
            customRoutes = customRoutes.filter(
              r => !(r.dayType === old.day_type && r.code === old.code)
            );
          } else {
            const row = payload.new;
            if (!row) return;
            const entry = mapRowToCustom(row);
            const idx = customRoutes.findIndex(
              r => r.dayType === entry.dayType && r.code === entry.code
            );
            if (idx >= 0) customRoutes[idx] = entry;
            else customRoutes.push(entry);
          }
          renderRouteGrid();
          renderTodayTags();
        } catch (e) {
          console.error("Realtime custom_routes handler failed:", e);
        }
      }
    )
    .subscribe((status) => {
      if (status === "SUBSCRIBED") {
        refreshCustomRoutes();
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        console.warn("Realtime custom_routes channel status:", status);
        if (!customReconnectTimer) {
          customReconnectTimer = setTimeout(() => {
            customReconnectTimer = null;
            subscribeCustom();
          }, 5000);
        }
      }
    });
  unsubCustom = channel;
}

async function saveRouteArea(dayType, code, label, area) {
  const entry = {
    code,
    label:    label || "",
    dayType,
    area:     area || "",
    addedBy:  (currentAccount && currentAccount.email) || myName || "anonymous",
    addedAt:  Date.now()
  };
  const idx = customRoutes.findIndex(r => r.dayType === dayType && r.code === code);
  if (idx >= 0) customRoutes[idx] = { ...customRoutes[idx], ...entry };
  else customRoutes.push(entry);
  renderRouteGrid();
  renderTodayTags();
  if (!db) return;
  try {
    const { error } = await db.from("custom_routes").upsert(
      {
        day_type: dayType,
        code,
        label:    entry.label,
        area:     entry.area,
        added_by: entry.addedBy,
        added_at: entry.addedAt
      },
      { onConflict: "day_type,code" }
    );
    if (error) throw error;
  } catch (e) {
    console.error("Could not save route area to Supabase:", e);
    refreshCustomRoutes();
  }
}

function toggleManual() {
  const p = document.getElementById("manualPanel");
  p.style.display = p.style.display === "none" ? "flex" : "none";
}

function findRouteAnywhere(code) {
  const custom = {};
  customRoutes.forEach(r => { custom[r.dayType + "|" + r.code] = r; });
  const lists = [["even", EVEN_ROUTES], ["odd", ODD_ROUTES]];
  for (const [dt, list] of lists) {
    const hit = list.find(r => r[0] === code);
    if (hit) {
      const c = custom[dt + "|" + code];
      return { dayType: dt, label: (c && c.label) || hit[1], area: (c && c.area) || "" };
    }
  }
  const c = customRoutes.find(r => r.code === code);
  return c ? { dayType: c.dayType, label: c.label || "", area: c.area || "" } : null;
}

function onManualCodeInput() {
  const code = (document.getElementById("manualCode").value || "").trim();
  const hint = document.getElementById("manualHint");
  const found = code ? findRouteAnywhere(code) : null;
  if (!found) { hint.textContent = ""; return; }
  hint.textContent = T("routeExists") + ": " + (found.label || code) + " — " + (found.area || T("ungrouped")) + ". " + T("pickToUpdate");
  const nameEl = document.getElementById("manualName");
  if (!nameEl.value) nameEl.value = found.label;
  document.getElementById("manualArea").value = found.area || "";
}

async function addManualRoute() {
  const statusEl = document.getElementById("statusMsg");
  statusEl.textContent = "";
  statusEl.className = "status-msg";
  const code = (document.getElementById("manualCode").value || "").trim();
  let label = (document.getElementById("manualName").value || "").trim();
  const areaVal = document.getElementById("manualArea").value;
  if (!code) { statusEl.textContent = T("enterRouteNumber"); statusEl.classList.add("err"); return; }
  if (!areaVal) { statusEl.textContent = T("chooseArea"); statusEl.classList.add("err"); return; }
  if (!db || !myId) { statusEl.textContent = T("noStorage"); statusEl.classList.add("err"); return; }
  const area = areaVal === "ungrouped" ? "" : areaVal;
  const existing = findRouteAnywhere(code);
  if (existing && !label) label = existing.label;
  const docDay = existing ? existing.dayType : dayType;
  await saveRouteArea(docDay, code, label, area);
  if (!todayRoutes.some(r => r.code === code)) {
    todayRoutes.push({ code: code, label: label, manual: true });
    await saveTodayRoutes();
    renderTodayTags();
  }
  document.getElementById("manualCode").value = "";
  document.getElementById("manualName").value = "";
  document.getElementById("manualArea").value = "";
  document.getElementById("manualPanel").style.display = "none";
  document.getElementById("manualHint").textContent = "";
  statusEl.textContent = existing ? T("updatedRoute") : T("addedManual");
  statusEl.classList.add("ok");
}

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function buildZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0, centralSize = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const local = new Uint8Array(30 + name.length), dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true); dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true); local.set(name, 30);
    parts.push(local, data);
    const cen = new Uint8Array(46 + name.length), cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true); cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true); cen.set(name, 46);
    central.push(cen); centralSize += cen.length; offset += local.length + data.length;
  });
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true); ev.setUint32(16, offset, true);
  const all = parts.concat(central, [end]);
  const total = all.reduce((s, a) => s + a.length, 0), out = new Uint8Array(total);
  let p = 0; all.forEach(a => { out.set(a, p); p += a.length; });
  return out;
}

function xmlEsc(s) {
  return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function colName(n) { let s = ""; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }

function sheetXml(rows, widths, freezeCols, wrap) {
  let sd = "";
  rows.forEach((row, ri) => {
    let cells = "";
    row.forEach((v, ci) => {
      if (v === null || v === undefined || v === "") return;
      const ref = colName(ci) + (ri + 1);
      if (typeof v === "number") cells += '<c r="' + ref + '"' + (ri === 0 ? ' s="1"' : '') + '><v>' + v + '</v></c>';
      else cells += '<c r="' + ref + '" t="inlineStr" s="' + (ri === 0 ? 1 : (wrap ? 2 : 0)) + '"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
    });
    sd += '<row r="' + (ri + 1) + '">' + cells + '</row>';
  });
  const pane = freezeCols
    ? '<pane xSplit="' + freezeCols + '" ySplit="1" topLeftCell="' + colName(freezeCols) + '2" activePane="bottomRight" state="frozen"/>'
    : '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>';
  const cols = '<cols>' + widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("") + '</cols>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">' + pane + '</sheetView></sheetViews>' + cols + '<sheetData>' + sd + '</sheetData></worksheet>';
}

function buildXlsx(sheets) {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const PR = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const hdr = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files = [];
  files.push({ name: "[Content_Types].xml", data: hdr + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' + sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' });
  files.push({ name: "_rels/.rels", data: hdr + '<Relationships xmlns="' + PR + '"><Relationship Id="rId1" Type="' + RNS + '/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
  files.push({ name: "xl/workbook.xml", data: hdr + '<workbook xmlns="' + NS + '" xmlns:r="' + RNS + '"><sheets>' + sheets.map((s, i) => '<sheet name="' + xmlEsc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join("") + '</sheets></workbook>' });
  files.push({ name: "xl/_rels/workbook.xml.rels", data: hdr + '<Relationships xmlns="' + PR + '">' + sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="' + RNS + '/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join("") + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="' + RNS + '/styles" Target="styles.xml"/></Relationships>' });
  files.push({ name: "xl/styles.xml", data: hdr + '<styleSheet xmlns="' + NS + '"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDE6EC"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' });
  sheets.forEach((s, i) => files.push({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", data: sheetXml(s.rows, s.widths, s.freezeCols || 0, !!s.wrap) }));
  return buildZip(files);
}

function addDaysIso(iso, n) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

async function fetchSubmissionsRange(from, to) {
  const out = [];
  let fromIndex = 0;
  const pageSize = 1000;
  while (true) {
    const { data, error } = await db.from("submissions").select("*")
      .gte("date", from).lte("date", to).order("date", { ascending: true })
      .range(fromIndex, fromIndex + pageSize - 1);
    if (error) throw error;
    const page = data || [];
    out.push(...page);
    if (page.length < pageSize) break;
    fromIndex += pageSize;
  }
  return out;
}

function routeText(r) { return r.label ? r.label + " (" + r.code + ")" : String(r.code); }

function openStats() {
  closeMenu();
  const f = document.getElementById("statsFrom"), t = document.getElementById("statsTo");
  const today = todayStr();
  if (!t.value) t.value = today;
  if (!f.value) f.value = today.slice(0, 8) + "01";
  document.getElementById("statsMsg").textContent = "";
  document.getElementById("statsOverlay").classList.add("open");
}
function closeStats() { document.getElementById("statsOverlay").classList.remove("open"); }

async function downloadStats() {
  const msg = document.getElementById("statsMsg"), btn = document.getElementById("statsBtn");
  const setMsg = (text, cls) => { msg.textContent = text; msg.className = "status-msg" + (cls ? " " + cls : ""); };
  const from = document.getElementById("statsFrom").value, to = document.getElementById("statsTo").value;
  if (!from || !to || from > to) { setMsg(T("statsBadRange"), "err"); return; }
  if (addDaysIso(from, 366) < to) { setMsg(T("statsTooLong"), "err"); return; }
  if (!db) { setMsg(T("noStorage"), "err"); return; }
  btn.disabled = true;
  setMsg(T("statsBuilding"));
  try {
    const docs = await fetchSubmissionsRange(from, to);
    const valid = docs.filter(d => d && d.date && (d.routes || []).length);
    if (!valid.length) { setMsg(T("statsNoData"), "err"); btn.disabled = false; return; }

    const ids = Array.from(new Set(valid.map(d => d.user_id).filter(Boolean)));
    const profiles = {};
    if (ids.length) {
      const { data: profileRows, error: profileError } = await db.from("profiles").select("id,display_name").in("id", ids);
      if (profileError) throw profileError;
      (profileRows || []).forEach(p => { profiles[p.id] = p.display_name; });
    }
    const personKey = d => d.user_id || ("legacy:" + (d.person_name || "Unknown"));
    const nameOf = d => profiles[d.user_id] || d.person_name || T("statsUnknown");
    const locale = currentLang === "fi" ? "fi-FI" : "en-US";
    const weekday = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(locale, { weekday: "long" }); };

    valid.sort((a, b) => a.date.localeCompare(b.date) || nameOf(a).localeCompare(nameOf(b)));

const byDay = [[T("statsColDate"), T("statsColPerson"), T("statsColCount"), T("statsColRoutes")]];
    valid.forEach(d => byDay.push([d.date, nameOf(d), d.routes.length, d.routes.map(routeText).join(", ")]));

    const dates = Array.from(new Set(valid.map(d => d.date))).sort();
    const people = Array.from(new Set(valid.map(personKey))).sort((a, b) => {
      const da = valid.find(x => personKey(x) === a), dbb = valid.find(x => personKey(x) === b);
      return nameOf(da).localeCompare(nameOf(dbb));
    });
    const matrix = [[T("statsColPerson")].concat(dates, [T("statsColDays"), T("statsColTotal")])];
    people.forEach(pid => {
      const personRecord = valid.find(x => personKey(x) === pid);
      const row = [nameOf(personRecord)];
      let days = 0, total = 0;
      dates.forEach(dt => {
        const d = valid.find(x => personKey(x) === pid && x.date === dt);
        if (d) { row.push(d.routes.map(routeText).join(", ")); days++; total += d.routes.length; } else row.push("");
      });
      row.push(days, total);
      matrix.push(row);
    });

    const bytes = buildXlsx([
      { name: T("statsSheetByDay"), rows: byDay, widths: [12, 14, 24, 16, 14, 70], wrap: true },
      { name: T("statsSheetPerPerson"), rows: matrix, widths: [24].concat(dates.map(() => 30), [12, 16]), freezeCols: 1, wrap: true }
    ]);
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const filename = "route-statistics_" + from + "_to_" + to + ".xlsx";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setMsg(T("statsSaved"), "ok");
  } catch (e) {
    const code = e && e.code;
    setMsg(code === "declined" ? T("statsDeclined") : (code === "unavailable" || code === "not_granted" || code === "extension_not_enabled") ? T("statsUnavailable") : T("genericError"), "err");
  }
  btn.disabled = false;
}

// ---------- Refresh profile on resume ----------
async function refreshProfileOnResume() {
  if (!myId || !db) return;
  try {
    const fresh = await getBestDisplayName({ id: myId, email: currentAccount ? currentAccount.email : "", user_metadata: null });
    if (fresh && fresh !== myName) {
      myName = fresh;
      if (todayRoutes.length > 0) {
        await saveTodayRoutes();
      }
    }
  } catch (e) { /* ignore */ }
  updateAccountCircle();
}
window.addEventListener("focus", refreshProfileOnResume);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshProfileOnResume(); });

// ---------- Header: hide on scroll down, show on scroll up ----------
(function () {
  let lastY = window.scrollY || 0;
  window.addEventListener("scroll", () => {
    const hdr = document.getElementById("headerRow");
    const btn = document.getElementById("menuBtn");
    if (!hdr) return;
    const y = window.scrollY || 0;
    const setHidden = (v) => { hdr.classList.toggle("hidden", v); if (btn) btn.classList.toggle("hidden", v); };
    if (y <= 10) setHidden(false);
    else if (y > lastY + 6) setHidden(true);
    else if (y < lastY - 6) setHidden(false);
    lastY = y;
  }, { passive: true });
})();
